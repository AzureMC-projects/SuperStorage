plugins {
    id 'application'
}

group = 'superstorage'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.formdev:flatlaf:3.5.4'   // modern look & feel (Apache 2.0)
}

application {
    mainClass = 'superstorage.SuperStorage'
}

// One self-contained jar (includes FlatLaf): build/libs/SuperStorage-<version>.jar
jar {
    archiveBaseName = 'SuperStorage'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': 'superstorage.SuperStorage',
                'Implementation-Title': 'SuperStorage',
                'Implementation-Version': project.version,
                'Implementation-Vendor': 'JacobProjects'
        )
    }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
}
